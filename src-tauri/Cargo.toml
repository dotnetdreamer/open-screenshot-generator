[package]
name = "open-screenshot-generator"
version = "1.0.10"
description = "Open Screenshot Generator, a device mockup and app screenshot design studio"
authors = ["dotnetdreamer <dotnetdreamer@users.noreply.github.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "open_screenshot_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `unstable` is what lets a window hold a second webview (Window::add_child):
# the browser beside Growth's Ask AI conversation (growth_browser.rs).
# At least 2.12, for tao 0.37: tao 0.35 held its keyboard lock across
# PeekMessageW, so a focus change that came in while it read a key froze the
# Windows app for good. @tauri-apps/api in package.json is kept on the same
# minor version.
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# In-app updates from our own update server (updater.rs). Held on 2.12 until a
# newer release has been tried against the update server.
tauri-plugin-updater = "~2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decoding the PNG the MCP export tools hand over for a file-path export, and
# (on Windows) the assistant-window screenshots. Cross-platform because
# `export_png { save: true }` writes files on every desktop platform.
base64 = "0.22"

# Minimal blocking HTTP server for the opt-in local MCP server (mcp_server.rs).
# Localhost only, one accept thread + a thread per request; no async runtime, and
# a clean shutdown via recv_timeout so the on/off toggle can stop it instantly.
tiny_http = "0.12"

# ISO-8601 timestamps for the WebContent-process crash log and the
# abs_webview_crash_info report (webview_crash.rs). Already in the dependency
# tree via tauri's cookie handling, so this adds no new crate, and the crash
# hook only exists on macOS/iOS, so other targets do not build it at all.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
time = { version = "0.3", features = ["formatting"] }

# Apple's subject lifting for the background remover (cutout.rs): Vision's
# foreground instance mask, macOS 14 and later, checked at run time. The same
# 0.3 line as the objc2 crates tauri already resolves, with only the headers
# the request needs. icon_export.rs asks Foundation (NSFileManager,
# NSPathUtilities, NSURL) for the folder macOS keeps on a file's own drive for
# replacing that file (NSItemReplacementDirectory), which the App Store sandbox
# lets the app use after the save dialog, so a zip there is swapped in in one step.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSFileManager", "NSIndexSet", "NSPathUtilities", "NSString", "NSURL"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "objc2-core-video", "VNGenerateForegroundInstanceMaskRequest", "VNObservation", "VNRequest", "VNRequestHandler"] }

# Screenshot capture of the assistant windows for the operation timeline.
# Windows only: WebView2's CapturePreview renders even while the window is
# hidden, so a background run is still traceable. Versions must match the ones
# wry already resolves (webview2-com 0.39 -> windows 0.62) or the COM types the
# `with_webview` controller hands back will not line up.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # store_package.rs: GetCurrentPackageFullName tells the Store build apart.
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_UI_Shell",
  # updater.rs: an MSIX install runs with a package identity, which tells the
  # Microsoft Store build apart from the installers and the portable exe.
  "Win32_Storage_Packaging_Appx",
  # devtools.rs: find the inspector window in our own process tree and WM_CLOSE
  # it, since WebView2 exposes no way to close or query it.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  # folder_lock.rs: a named mutex per folder an icon write changes, named after
  # the folder's file index, so the Store build and the installers take turns,
  # with a DACL (from SDDL) that lets every signed-in user wait on it.
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

# `devtools` keeps open_devtools() available outside debug builds, for Settings >
# Developer tools. Windows only, on purpose: the same feature is a *private* API
# on macOS, which would put the Mac App Store build (docs/DESKTOP.md) at risk of
# rejection. Cargo unions features per target, so mac/Linux release builds ship
# without it and devtools.rs compiles the item out there.
tauri = { version = "2.12", features = ["devtools"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
