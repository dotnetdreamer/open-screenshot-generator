<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk.woff2") format("woff2"); font-weight: 300 700; }
@font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
@font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-400i.woff2") format("woff2"); font-weight: 400; font-style: italic; }
body{margin:0;background:#222;display:flex;flex-wrap:wrap;gap:6px;padding:6px;font:14px sans-serif;color:#ff0}
figure{margin:0}canvas{display:block;width:var(--w,256px)}
</style></head><body>
<script type="module">
// Dev only: draws screens at chosen demo times. ?s=0,1&t=-0.5,0,0.5&w=256
import { createScreens } from "./assets/film/screens.js";
import { loadFonts, loadShots } from "./assets/film/assets.js";
import { landAt } from "./assets/film/timing.js";
const q = new URLSearchParams(location.search);
const S = (q.get("s") || "0").split(",").map(Number);
const T = (q.get("t") || "-0.5,0,0.3,0.6,0.9,1.4").split(",").map(Number);
if (q.get("w")) document.body.style.setProperty("--w", q.get("w") + "px");
await loadFonts();
const shots = await loadShots();
const screens = createScreens(shots);
for (const s of S) for (const lt of T) {
  const sc = screens[s];
  sc.draw(landAt(s) + lt);
  const c = document.createElement("canvas");
  c.width = sc.canvas.width; c.height = sc.canvas.height;
  c.getContext("2d").drawImage(sc.canvas, 0, 0);
  const fig = document.createElement("figure");
  fig.appendChild(c);
  const cap = document.createElement("figcaption"); cap.textContent = `s${s} lt=${lt}`; fig.appendChild(cap);
  document.body.appendChild(fig);
}
window.__done = true;
</script></body></html>
