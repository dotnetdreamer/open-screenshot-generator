ll,null,"http://help.mojang.com"]],["help@minecraft.net"],null,null,["Microsoft Corporation",["contactmojang@minecraft.net"],["1 Microsoft Way\nRedmond, WA 98052\nUnited States"],"+1 800-642-7676"]],null,null,[[null,"Dive into an open world of block building, crafting, and survival in the ultimate sandbox adventure. Gather resources, survive the night, and build a world one block at a time in this online survival game. Explore and craft your way through a completely open world where you can play with friends, new and old. Build a city, start a farm, mine deep underground, face mysterious enemies, or just experiment to the limits of your imagination in this expansive simulation!\u003cbr\u003e\u003cbr\u003eCraft a new house, build cities, or start a farm. Bring your imagination to life and build your dream world where the possibilities are endless. Adventure through your own online game and play with friends, block building from the ground up in our crafting simulation. In Creative mode, enjoy unlimited resources and the freedom of superior block building and crafting. In Survival mode, survive the night, face intense battles, craft tools, and fend off danger in your world. With seamless cross-platform and multiplayer gameplay on Minecraft: Bedrock Edition, you can adventure solo or with friends and discover an infinite, randomly generated online world filled with blocks to mine, biomes to explore, and mobs to befriend (or battle) in a universe of crafting!\u003cbr\u003e\u003cbr\u003eIn Minecraft, the world is yours to shape!\u003cbr\u003e\u003cbr\u003eBUILD YOUR DREAM WORLD\u003cbr\u003e\u003cbr\u003e• Build a house or create an entire world from the ground up\u003cbr\u003e• Block building games for kids, adults, or anyone\u003cbr\u003e• Craft and build your world from special resources and tools to create brand new structures and landscapes\u003cbr\u003e• Use survival strategies to explore an endless open world simulation full of different biomes and creatures\u003cbr\u003e• Minecraft Marketplace – Get creator-made add-ons, thrilling worlds, and stylish cosmetics on Minecraft Marketplace\u003cbr\u003e• Private and community servers – Online games allow you to connect with millions of players, or subscribe to Realms Plus to cross-play with up to 10 friends on your own private server online game\u003cbr\u003e• Slash commands – Tweak how the game plays: you can change the weather, summon mobs, change the time of day, and more within your online world\u003cbr\u003e• Add-ons – Block builders can customize their experience even further with add-ons as they build up! If you\u0026#39;re more tech-inclined, you can modify your game to create new resource packs online\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eMULTIPLAYER ONLINE GAMES\u003cbr\u003e• Join free massive multiplayer servers and play with thousands of other builders\u003cbr\u003e• Multiplayer servers allow you to play with up to 4 players online with a free Xbox Live account\u003cbr\u003e• Explore endless realms where your survival strategies are put to the test. With Realms and Realms Plus, you can play with up to 10 friends cross-platform, anytime, anywhere on Realms, your own private server that we host for you\u003cbr\u003e• Customize your world with Realms Plus. Get instant access to an extensive catalogue that is refreshed every month! Share with friends on your own private Realms server*\u003cbr\u003e• MMO servers allow you to connect and play with players across the world, to explore custom worlds, build with friends, and participate in large-scale events\u003cbr\u003e• Enjoy crafting buildings, building gigantic community-run worlds, competing in unique mini-games, and socializing in lobbies full of fellow Minecraft block builders\u003cbr\u003e\u003cbr\u003eSUPPORT: https://www.minecraft.net/help\u003cbr\u003eLEARN MORE: https://www.minecraft.net/\u003cbr\u003e\u003cbr\u003eMINIMUM RECOMMENDED SPECIFICATION\u003cbr\u003eTo check the requirements for your device visit: https://help.minecraft.net/hc/en-us/articles/4409172223501\u003cbr\u003e\u003cbr\u003e*Realms \u0026amp; Realms Plus: Try a free 30-day trial in-app.\u003cbr\u003e\u003cbr\u003eThis app uses Accessibility services.\u003cbr\u003eMinecraft includes an Accessibility Service that improves touch interaction when using a screen reader. This service only adjusts touch-passthrough regions — it does not read, log, or transmit your screen content or personal data."]],[[null,"Millions of crafters have smashed billions of blocks! Now you can join the fun!"]],[null,null,[[["Photos/Media/Files",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pHtIujPWxciAZcfYSwlrGGq14Z984rKLMgcm9RPATLiOlbrWy-tVlelEWgED7gpktgcD1tZizVeHiO5fkw"]],[[null,"read the contents of your USB storage"],[null,"modify or delete the contents of your USB storage"]],["perm_media"]],["Storage",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/aWNKQedLTpw6u6yyMjQObmuoKu67A1czWnIcvID86oAmMT02r5mNdRn6l9ZN2t2MIyH6tNy-01v7ukeQ"]],[[null,"read the contents of your USB storage"],[null,"modify or delete the contents of your USB storage"]],["storage"]],["Wi-Fi connection information",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/U-_SG8pHTsqU_IyZTGQRkVMdLaAUeq1OnKGrB06KHF1z7vkkIQK3iF0HcbfTe1RnGlh-ajnZkbphl2W3Gdk"]],[[null,"view Wi-Fi connections"]],["signal_wifi_4_bar"]]],[["Other",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pkKXoPl5q7n8T0s7KREtdvUZn1PLRgx-Ox0t4tkO8af4JpgGbyAxLBTsvEKKBCjwBACQsZisSYNmHPGbBA"]],[[null,"view network connections"],[null,"allow Wi-Fi Multicast reception"],[null,"full network access"],[null,"control vibration"],[null,"prevent device from sleeping"],[null,"Google Play license check"]],["quiz"]]],[[null,"receive data from Internet"]]]],null,null,["com.mojang.minecraftpe"],[[[null,2,[1242,2208],[null,null,"https://play-lh.googleusercontent.com/ywPBuExmYGLE6oL7QENmI7wOxMPOU-XatzosE6M4bgXudBsMQWcKp1QHhHrJM1QeTadoVo7lnpO5O12WyzlYQA"]],[nul
