.com/"]],["support@ludoking.com"],null,null,["GAMETION GLOBAL TECHNOLOGIES PTE. LIMITED",["support@gametion.com"],["435 Orchard Road\n#11-00 Wisma Atria\nSingapore 238877"],"+91 80975 97532"]],null,null,[[null,"*THIS IS OFFICIAL LUDO KING® GAME\u003cbr\u003e\u003cbr\u003e2 Billion Downloads\u003cbr\u003e\u003cbr\u003eAdda (Club) is live! Create your own or join others to chat and hang out.\u003cbr\u003e\u003cbr\u003eLudo King® is board game played between friends, family \u0026amp; kids. \u003cbr\u003e* 2/3/4/5/6 Players online Ludo game mode available\u003cbr\u003e* 2/3/4 Players Snakes and Ladders game mode available\u003cbr\u003e* 8 Players tournament available\u003cbr\u003e* New Ludo season released each month\u003cbr\u003e* Play daily goals and get free dice, coins and diamonds\u003cbr\u003e\u003cbr\u003eLudo King® is a classic board game played between friends and family. Play the dice game of kings! Recall your childhood! In some places, Ludo is also known as Parchisi, Pachisi, parcheesi or Parchisi game.\u003cbr\u003e\u003cbr\u003eLudo King is a cross platform multiplayer game that supports Desktop, Android, iOS, HTML5 and Windows mobile platform at same time. This game also support offline mode, where player can play with Computer or, Local multiplayer (pass and play mode). Play this dice game Ludo King. Best casual game in board games.\u003cbr\u003e\u003cbr\u003eNew Game Themes available:\u003cbr\u003eDisco / Night mode Theme\u003cbr\u003eNature Theme\u003cbr\u003eEgypt Theme\u003cbr\u003ePinball Theme\u003cbr\u003eCandy Theme\u003cbr\u003eChristmas Theme\u003cbr\u003ePenguin Theme\u003cbr\u003eBattle Theme\u003cbr\u003eDiwali Theme\u003cbr\u003ePirate Theme\u003cbr\u003eSui Dhaaga Theme\u003cbr\u003eMarble Theme\u003cbr\u003eAlien Theme\u003cbr\u003eOctopus Theme\u003cbr\u003eTaj Mahal Theme\u003cbr\u003e\u003cbr\u003eWhat\u0026#39;s new:\u003cbr\u003e* Social chat (text and voice)\u003cbr\u003e* Search- Worldwide players search\u003cbr\u003e* Quick mode\u003cbr\u003e* Tournament available\u003cbr\u003e* Real chat with friends and buddies\u003cbr\u003e* Challenge Facebook friends/buddies\u003cbr\u003e* Save/Load Ludo game option\u003cbr\u003e* More user-friendly UI\u003cbr\u003e* Low end devices support\u003cbr\u003e\u003cbr\u003eLudo King is the modern version of the royal game of Pachisi. A Ludo game which was played between Indian kings and queens in ancient times. Roll the Ludo dice and move your tokens to reach the center of the Ludo board. Beat other players, become the Ludo King.\u003cbr\u003e\u003cbr\u003eLudo King follows the traditional rules and the old school look of the Ludo game. Just like the kings and queens of India\u0026#39;s golden age, your fate depends on the roll of the Ludo\u0026#39;s dice and your strategy of moving the tokens effectively. \u003cbr\u003e\u003cbr\u003eFeatures of Ludo King:\u003cbr\u003e* No internet connection required! Play against the computer\u003cbr\u003e* Play with your family and friends through Local and Online Multiplayer\u003cbr\u003e* Play 2 to 6 Player Local Multiplayer Mode\u003cbr\u003e* Invite and challenge your Facebook Friends in a private game room and beat them to become Ludo King\u003cbr\u003e* Private chat with your Facebook friends \u0026amp; Buddies\u003cbr\u003e* Play Snake and Ladders on 7 different game board variations\u003cbr\u003e\u003cbr\u003eLudo King is a friends and family game that was once played by kings and now it can be enjoyed by you and your family and friends. You\u0026#39;ll be playing this Ludo for hours and its fun for the whole family.\u003cbr\u003e\u003cbr\u003eLudo King is a perfect time pass game of Ludo board game. You played Ludo in your childhood, now play on your phone and tablet.\u003cbr\u003e\u003cbr\u003eAnother nostalgic game similar in structure is Snakes and Ladders. Like Ludo, you may have played this board game when you were young. Ludo King now incorporates this classic Snakes and Ladders game as a whole new level. The objective of the game is simple: you have to be the first one to make it to 100. A game of ups and down, Snakes and Ladders has been a favorite for generations; and now you can play it too, with Ludo King. \u003cbr\u003e\u003cbr\u003eLudo has different names in different regions and countries like Fia, Fia-spel (Fia the game), Le Jeu de Dada (The Game of Dada), Non t\u0026#39;arrabbiare, Fia med knuff (Fia with push), Cờ cá ngựa, Uckers, Griniaris, Petits Chevaux (Little Horses), Ki nevet a végén, برسي (Barjis/Barjees). People also misspell Ludo as Loodo, Chakka, Lido, Lado, Ledo, Leedo, Laado, or Lodo.\u003cbr\u003e\u003cbr\u003eFollow us to get news and updates:\u003cbr\u003e* Facebook: https://www.facebook.com/ludokinggame\u003cbr\u003e* Twitter: https://x.com/LudoKingGame\u003cbr\u003e* YouTube: https://www.youtube.com/c/LudoKing\u003cbr\u003e* Instagram: https://www.instagram.com/ludokinggame/\u003cbr\u003e* Addictive Games: https://addictivegames.com/\u003cbr\u003e* https://ludoking.com\u003cbr\u003e\u003cbr\u003eIGRS RATING: 13+"]],[[null,"Ludo King is a board game played between friends and family. A fun dice game."]],[null,null,[[["Microphone",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/daUjqbSOr2QpaqXS2HQbNzYzzqN2yWGzM_7AZxwFaWLT7_kIhX95HKi_HSpjeeQDOmFMENZxJqblbu_4qg"]],[[null,"record audio"]],["perm_camera_mic"]]],[["Other",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pkKXoPl5q7n8T0s7KREtdvUZn1PLRgx-Ox0t4tkO8af4JpgGbyAxLBTsvEKKBCjwBACQsZisSYNmHPGbBA"]],[[null,"view network connections"],[null,"pair with Bluetooth devices"],[null,"full network access"],[null,"change your audio settings"],[null,"control vibration"],[null,"prevent device from sleeping"],[null,"Google Play license check"]],["quiz"]]],[[null,"receive data from Internet"]]]],null,null,["com.ludo.king"],[[[null,2,[1920,1080],[null,null,"https://play-lh.googleusercontent.com/ODYAnRdNqJduH8ZAckodyUM6nFnainP-XIrEpj00WtxC4GRLVUrcxEIHSBauPXmsVxNIsvzHk9jRMvzzoSu
