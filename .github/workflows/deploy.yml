name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enables GitHub Pages (source: GitHub Actions) on first run,
      # so no manual step in repo Settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Served at the root of the custom domain (editor.openscrgen.app), so no
      # basePath. NEXT_PUBLIC_BASE_PATH stays unset -> basePath defaults to ''.
      # public/CNAME carries the custom domain into the published output.
      - run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          NEXT_PUBLIC_GITHUB_OAUTH_PROXY: ${{ vars.NEXT_PUBLIC_GITHUB_OAUTH_PROXY }}
          NEXT_PUBLIC_TRANSLATION_PRIMARY_URL: ${{ vars.NEXT_PUBLIC_TRANSLATION_PRIMARY_URL }}
          NEXT_PUBLIC_TRANSLATION_FALLBACK_URL: ${{ vars.NEXT_PUBLIC_TRANSLATION_FALLBACK_URL }}
          # The community feed (Discover). A repo variable rather than a literal,
          # like every other one here: a fork that has not set it builds an
          # editor with no Discover in it, which is the right default for
          # somebody who has not stood up a backend. Set it to the PocketBase
          # host from infra/vps — for this deployment, https://pb.openscrgen.app.
          NEXT_PUBLIC_DISCOVER_URL: ${{ vars.NEXT_PUBLIC_DISCOVER_URL }}
          # The MCP relay from infra/vps/mcp-relay, which lets Claude Code,
          # Claude Desktop, Cursor or VS Code drive the web editor. Unset means
          # the MCP status pill never renders, which is the right default for a
          # fork with no relay of its own. For this deployment,
          # https://mcp.openscrgen.app.
          NEXT_PUBLIC_MCP_RELAY_URL: ${{ vars.NEXT_PUBLIC_MCP_RELAY_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
