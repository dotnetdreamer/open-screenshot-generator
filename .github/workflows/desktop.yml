name: Release desktop app (Tauri)

# Builds the downloadable installers: Windows (.msi + .exe + portable .zip),
# macOS (universal .dmg) and Linux (.AppImage + .deb).
#
# Manual only, on purpose. Nothing here fires on a push or a tag: you start a
# release from the Actions tab, and the run owns the version.
#
#   bump: patch (default) / minor / major   auto-increments from the current
#         version in src-tauri/tauri.conf.json
#   version: 1.2.0                          overrides the bump with an exact
#         version when you want to choose it yourself
#   dry_run: build the installers and attach them to the run as artifacts,
#         without bumping the version, tagging, or publishing a release
#   microsoft_store: also pack the Windows exe as an MSIX and submit it to the
#         Microsoft Store. On a dry run the MSIX is built and attached to the
#         run, but not submitted. Setup: docs/DESKTOP.md, "Publishing from
#         GitHub Actions".
#
# A real run bumps the version across all four files that carry it, commits
# that to the default branch, tags it, and publishes a release with the
# installers attached.
#
# NOTE: NEXT_PUBLIC_BASE_PATH must stay UNSET here. The GitHub Pages deploy
# (deploy.yml) builds under /open-screenshot-generator; the desktop app is served from
# the bundle root, so a base path would 404 every asset.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'How to increment the version (ignored if "version" is set)'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Exact version, e.g. 1.2.0. Leave empty to auto-increment.'
        type: string
        default: ''
      dry_run:
        description: 'Build only: no version bump, no tag, no release'
        type: boolean
        default: false
      microsoft_store:
        description: 'Also submit the Windows build to the Microsoft Store (version 1.0.0 or later)'
        type: boolean
        default: false

permissions:
  contents: write

# Two releases racing would bump the version off the same base and produce
# duplicate tags. Queue them instead.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Decides the version once, so the three build legs cannot disagree about it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      # The build legs check out this sha: on a real run it is the version-bump
      # commit, so the binaries carry the released version rather than the old
      # one. On a dry run nothing was committed and it is just the trigger sha.
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version, commit and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          selector='${{ inputs.version || inputs.bump }}'

          # Resolve the version first, without writing anything: it is needed
          # for the duplicate-tag check below, and on a dry run that is all we
          # want.
          version=$(node scripts/set-version.mjs "$selector" --dry-run)

          # Checked before anything is tagged, so a Store run that cannot
          # succeed stops here instead of after a full release. A dry run packs
          # the version already in the repo, a real run the new one.
          if [ '${{ inputs.microsoft_store }}' = 'true' ]; then
            packed="$version"
            if [ '${{ inputs.dry_run }}' = 'true' ]; then
              packed=$(node -p "require('./src-tauri/tauri.conf.json').version")
            fi
            case "$packed" in
              0.*)
                echo "::error::The Microsoft Store rejects a version that starts with 0, and this run would pack ${packed}. Release 1.0.0 or later to publish there."
                exit 1 ;;
            esac
            if [ -z '${{ vars.MSSTORE_PRODUCT_ID }}' ]; then
              echo "::error::The MSSTORE_PRODUCT_ID repository variable is not set. See docs/DESKTOP.md, \"Publishing from GitHub Actions\"."
              exit 1
            fi
          fi

          if [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo "Dry run: would release v${version}. Not bumping, tagging or publishing."
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An existing tag means this version already shipped. Pushing it again
          # is a no-op, so the release would quietly attach to the old build.
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists. Pick a different version."
            exit 1
          fi

          node scripts/set-version.mjs "$selector"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json cli/package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "release: v${version}"
          git tag -a "v${version}" -m "Open Screenshot Generator v${version}"

          # Branch and tag pushed separately and explicitly. --follow-tags would
          # skip the tag, since it only pushes annotated tags reachable from the
          # commits being pushed, and quietly leaving the tag behind would strand
          # the release.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Releasing v${{ steps.bump.outputs.version }} (dry run = ${{ inputs.dry_run }})" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
          # Pinned to 22.04 rather than ubuntu-latest: the AppImage links
          # against the builder's glibc, so building on the oldest supported
          # runner keeps it usable on older distros.
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Tauri v2 on Linux needs webkit2gtk 4.1 (4.0 is v1), and patchelf +
      # librsvg are what the AppImage bundler shells out to.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "Save to your own storage" accounts (docs/ACCOUNT-SYNC.md). These
          # reach the frontend through beforeBuildCommand -> npm run build, so
          # they have to be set here rather than on an earlier step. Public
          # client ids, not secrets, hence vars and not secrets.
          #
          # The desktop Google client is a separate "Desktop app" OAuth client:
          # desktop signs in over a 127.0.0.1 loopback, which Google rejects for
          # web clients, so the web id is not a usable fallback here.
          # Its secret is required too: Google's token endpoint answers
          # "client_secret is missing." for an installed-app code exchange
          # without one, PKCE notwithstanding. It ends up in the shipped bundle
          # either way, which is what Google's installed-app docs expect; it is
          # read from either a secret or a var so it works whichever way the
          # repo has it stored, and kept out of the log by preferring the secret.
          NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_SECRET || vars.NEXT_PUBLIC_GOOGLE_DESKTOP_CLIENT_SECRET }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          NEXT_PUBLIC_TRANSLATION_PRIMARY_URL: ${{ vars.NEXT_PUBLIC_TRANSLATION_PRIMARY_URL }}
          NEXT_PUBLIC_TRANSLATION_FALLBACK_URL: ${{ vars.NEXT_PUBLIC_TRANSLATION_FALLBACK_URL }}
          # The community backend: Discover, cloud projects, and the sign-in
          # that live editing attributes every change to. Unset here until now,
          # which is why desktop releases had none of the three.
          NEXT_PUBLIC_DISCOVER_URL: ${{ vars.NEXT_PUBLIC_DISCOVER_URL }}
          # Live editing's signalling server, and the one variable the desktop
          # build genuinely needs that the web build does not.
          #
          # On the web it is left unset and the code falls back to
          # NEXT_PUBLIC_MCP_RELAY_URL, because signalling shares that container.
          # Desktop has no such fallback: it hosts its own MCP server over a
          # local socket (src-tauri/src/mcp_server.rs) and so is never given a
          # relay URL. Without this, the desktop app has no session server and
          # the Edit together item never appears.
          NEXT_PUBLIC_COLLAB_URL: ${{ vars.NEXT_PUBLIC_COLLAB_URL }}
          # Expiring TURN credentials, for the pairs whose networks refuse a
          # direct connection. The shared secret is never here: this names an
          # endpoint that mints credentials, not a credential.
          NEXT_PUBLIC_TURN_ENDPOINT: ${{ vars.NEXT_PUBLIC_TURN_ENDPOINT }}
          # STUN, which only tells a browser its own public address. Unset falls
          # back to Google's public server.
          NEXT_PUBLIC_STUN_URLS: ${{ vars.NEXT_PUBLIC_STUN_URLS }}
          # Windows only: link the MSVC C runtime statically. The default
          # dynamic linkage makes the exe fail with "VCRUNTIME140.dll was not
          # found" on a clean Windows install without the VC++ redistributable,
          # which the portable zip has no installer to paper over. With this,
          # WebView2 really is the only runtime requirement, as the release
          # notes and the portable README claim.
          RUSTFLAGS: ${{ matrix.platform == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
          # Uncomment once you have macOS signing set up (see docs/DESKTOP.md):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Empty tagName means "build, do not release", which is what a dry
          # run wants. The version job already pushed this tag.
          #
          # The condition reads inverted on purpose. `a && b || c` in GitHub
          # expressions returns c whenever b is falsy, and '' is falsy, so the
          # natural `dry_run && '' || format(...)` would hand back the tag on a
          # dry run and publish exactly the release it was meant to suppress.
          # Keep the non-empty value in the `&&` slot.
          tagName: ${{ !inputs.dry_run && format('v{0}', needs.version.outputs.version) || '' }}
          releaseName: ${{ !inputs.dry_run && format('Open Screenshot Generator v{0}', needs.version.outputs.version) || '' }}
          # Published, not a draft: all three legs append to the same release,
          # so it stays live while the slower platforms are still uploading.
          releaseDraft: false
          prerelease: false
          # The bundles are unsigned, so both OSes will warn on first launch.
          # Saying so here is cheaper than fielding the bug reports.
          releaseBody: |
            ## Download

            | Platform | File |
            | --- | --- |
            | Windows 10/11 | `.exe` (installer), `.msi`, or `_portable.zip` (no install) |
            | macOS 10.15+ (Intel + Apple silicon) | `.dmg` |
            | Linux | `.AppImage` (portable) or `.deb` |

            The portable Windows build is a single exe: unzip anywhere and run it. It needs the Microsoft Edge WebView2 Runtime, which is preinstalled on Windows 11 and on most Windows 10 systems. The installers set WebView2 up automatically; the portable build does not.

            These builds are not code-signed yet, so the first launch needs one extra click:

            - **Windows:** SmartScreen says "Windows protected your PC" -> More info -> Run anyway.
            - **macOS:** Gatekeeper says the app cannot be verified -> right-click the app -> Open -> Open.
            - **Linux:** `chmod +x` the AppImage before running it.

            The Linux AppImage runs against your system WebKitGTK when you have one installed, which is what keeps it working on rolling releases such as Arch and Fedora. Without one it falls back to the copy inside the AppImage. Set `OSG_APPIMAGE_STACK=bundled` to force that copy, or `=host` to require the system one.

            Projects are stored locally in the app. Nothing is uploaded anywhere.
          args: ${{ matrix.args }}

      # The bare release exe already is the portable build: Tauri embeds the
      # whole frontend in the binary and this app bundles no resources or
      # sidecars, so nothing else needs to travel with it. tauri-action only
      # knows installer bundles, so zip it up here. Depending on the Tauri CLI
      # version the exe in target/release carries the product name or the
      # crate name; prefer the former, fall back to the latter.
      - name: Package portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $release = 'src-tauri/target/release'
          $exe = @('Open Screenshot Generator.exe', 'open-screenshot-generator.exe') |
            ForEach-Object { Join-Path $release $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Host "Executables in ${release}:"
            # SilentlyContinue: the runner sets $ErrorActionPreference = 'stop',
            # and a missing target/release would otherwise kill the script here,
            # before the actual error message below.
            Get-ChildItem $release -Filter *.exe -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error 'Portable exe not found in target/release'
            exit 1
          }

          $stage = New-Item -ItemType Directory -Force -Path portable-stage
          Copy-Item $exe -Destination (Join-Path $stage 'Open Screenshot Generator.exe')
          Set-Content -Path (Join-Path $stage 'README.txt') -Value @(
            'Open Screenshot Generator (portable)',
            '',
            'No installation needed. Run "Open Screenshot Generator.exe".',
            '',
            'Requires the Microsoft Edge WebView2 Runtime. It is preinstalled on',
            'Windows 11 and on most Windows 10 systems. If the app does not start,',
            'install it from:',
            'https://developer.microsoft.com/en-us/microsoft-edge/webview2/',
            '',
            'Your work is stored in your Windows user profile, not next to the',
            'exe, so it is kept across updates but does not travel with this zip:',
            'projects live in %LOCALAPPDATA%\com.dotnetdreamer.openscreenshotgenerator',
            'and settings in %APPDATA%\com.dotnetdreamer.openscreenshotgenerator.'
          )

          $zip = 'Open.Screenshot.Generator_${{ needs.version.outputs.version }}_x64_portable.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      # tauri-action already published the release from this same job, so the
      # tag exists by now. --clobber keeps a re-run of this leg from failing
      # on the existing asset.
      - name: Attach portable zip to the release
        if: matrix.platform == 'windows-latest' && !inputs.dry_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload 'v${{ needs.version.outputs.version }}' 'Open.Screenshot.Generator_${{ needs.version.outputs.version }}_x64_portable.zip' --clobber

      # The Store gets the same exe as the installers, packed as an MSIX. It is
      # unsigned on purpose: Microsoft signs it after certification. It goes to
      # the run, not the release, because an unsigned MSIX will not install
      # anywhere but the Store or a machine in Developer Mode.
      #
      # The file is named after the version it packs, which on a dry run is the
      # one already in the repo rather than needs.version.outputs.version.
      - name: Pack the MSIX for the Microsoft Store
        if: matrix.platform == 'windows-latest' && inputs.microsoft_store
        run: node scripts/msix-pack.mjs

      - name: Upload the MSIX as a run artifact
        if: matrix.platform == 'windows-latest' && inputs.microsoft_store
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-msix
          if-no-files-found: error
          path: src-tauri/target/release/bundle/msix/*.msix

      # The AppImage carries the WebKitGTK it was built against, and that build
      # is pinned to ubuntu-22.04 so the binary keeps the oldest glibc we
      # support. On distros whose Mesa has moved on that WebKit cannot create an
      # EGL display, and the app comes up as a white window (issue #25). The
      # hook injected here prefers the host's WebKitGTK whenever there is a
      # complete one, and falls back to the bundle otherwise. It runs after
      # tauri-action because linuxdeploy writes AppRun itself, leaving no
      # earlier hook point.
      - name: Prefer the host WebKitGTK in the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          # Runners have no FUSE, so appimagetool cannot mount itself to run.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          appimage="$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' | head -n1)"
          if [ -z "$appimage" ]; then
            echo "No AppImage found under src-tauri/target" >&2
            find src-tauri/target -name '*.AppImage' >&2 || true
            exit 1
          fi
          PATH="$RUNNER_TEMP:$PATH" bash scripts/patch-appimage.sh "$appimage"
          echo "APPIMAGE_PATH=$appimage" >> "$GITHUB_ENV"

      # tauri-action uploaded the unpatched AppImage from this same job a step
      # ago, so this replaces it rather than adding to it.
      - name: Replace the released AppImage with the patched one
        if: matrix.platform == 'ubuntu-22.04' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload 'v${{ needs.version.outputs.version }}' "$APPIMAGE_PATH" --clobber

      # tauri-action only uploads to a GitHub release, so a dry run would
      # otherwise leave nothing to inspect. The .app is skipped on purpose:
      # zip flattening breaks its symlinks, and the dmg already contains it.
      - name: Upload installers as run artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            Open.Screenshot.Generator_*_portable.zip

  # Submits the MSIX from the Windows leg to the Microsoft Store. msstore
  # replaces the package in a copy of the last published submission, keeps its
  # listing, and commits it to certification. It waits only for the commit to
  # be accepted, a few minutes, not for certification, which can take days.
  #
  # The credentials live in the microsoft-store environment, so no other job
  # can read them. Like npm, it needs every build leg to succeed; after fixing
  # a failed leg, "Re-run failed jobs" runs this one too.
  microsoft-store:
    needs: [version, build]
    if: ${{ inputs.microsoft_store && !inputs.dry_run }}
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: microsoft-store-msix
          path: msix

      - name: Check the Store credentials
        shell: bash
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          missing=''
          [ -n "$TENANT_ID" ] || missing="$missing MSSTORE_TENANT_ID"
          [ -n "$SELLER_ID" ] || missing="$missing MSSTORE_SELLER_ID"
          [ -n "$CLIENT_ID" ] || missing="$missing MSSTORE_CLIENT_ID"
          [ -n "$CLIENT_SECRET" ] || missing="$missing MSSTORE_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the microsoft-store environment:${missing}. See docs/DESKTOP.md, \"Publishing from GitHub Actions\"."
            exit 1
          fi

      # Installs the Microsoft Store Developer CLI (msstore).
      - uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Sign in to Partner Center
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      # The .msix path goes in as the positional argument, which the CLI's MSIX
      # publisher takes as is. The docs' --inputFile flag does not exist; the
      # real one is --inputDirectory, for a folder to search.
      - name: Submit to the Microsoft Store
        env:
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $msix = Get-ChildItem msix -Filter *.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId $env:PRODUCT_ID

      - name: Summary
        run: |
          "Submitted v${{ needs.version.outputs.version }} to the Microsoft Store. Follow certification at https://partner.microsoft.com/dashboard/products/${{ vars.MSSTORE_PRODUCT_ID }}/overview" >> $env:GITHUB_STEP_SUMMARY

  # Puts the same version of the CLI on npm. GitHub never starts a workflow
  # from an event made with the GITHUB_TOKEN, so the release published above
  # cannot trigger npm.yml by itself; a dispatch is the one exception. It runs
  # on the release tag, so npm gets exactly the tagged code, and it still
  # waits for approval on the `npm` environment before anything is published.
  npm:
    needs: [version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the npm publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run npm.yml --repo "$GITHUB_REPOSITORY" --ref 'v${{ needs.version.outputs.version }}'
