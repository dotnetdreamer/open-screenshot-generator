name: Publish CLI to npm

# Ships cli/ to npm as "open-screenshot-generator", the package that provides
# the `osg` command and the MCP server behind the Claude Code plugin.
#
# The tarball carries a built copy of the editor. cli/scripts/pack-editor.mjs
# copies the same out/ that GitHub Pages deploys into cli/editor/, which is
# what lets `osg` drive the real editor with no network and no second renderer
# in the package. That is why this workflow builds the whole Next app before it
# ever touches cli/.
#
# How it starts: desktop.yml dispatches it on the release tag once a real
# release is out. GitHub never starts a workflow from an event made with the
# GITHUB_TOKEN, and a dispatch is the one exception, so a `release:` trigger
# here would never fire for the releases desktop.yml publishes. It can also be
# run by hand from the Actions tab, on main or a v* tag, to retry a publish npm
# rejected.
#
# The repository is public, so the logs, the artifacts and the tarball are all
# public. The jobs are split so that nothing able to publish shares a job with
# third-party code:
#
#   build     npm ci, the Next build and the CLI build, which run code from
#             thousands of packages. No secrets and no id-token. Packs the
#             tarball, refuses it if scripts/check-tarball.mjs finds a
#             credential, artwork or a stray file, and hands it on as a one day
#             artifact.
#   publish   runs npm itself on the finished tarball and nothing else. It is
#             the only job with id-token: write, and it runs in the `npm`
#             environment, which waits for a maintainer's approval and only
#             accepts main and v* tags.
#
# Auth is npm trusted publishing (OIDC): npm trusts this repository, this file
# and the `npm` environment, and no long-lived token exists. npm only offers
# trusted publishing on a package that is already on the registry, so the very
# first publish uses NPM_TOKEN, a short-lived secret on the `npm` environment.
# npm tries OIDC first and falls back to the token. Delete the secret once
# trusted publishing is configured.
#
# scripts/set-version.mjs owns every version in this repo, and this workflow
# publishes whatever cli/package.json says, unless npm already has that
# version. Then it publishes the next free patch instead and does not commit
# it (see "Pick the version to publish" below).

on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs racing would try to publish the same version twice. Queue them.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # The agent distribution channel: .claude-plugin/ plus the root .mcp.json are
  # what `/plugin install` reads. Browser-free and quick, so it gates the ten
  # minute build below rather than running beside it.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Three hand-written manifests that nothing else in CI parses. A trailing
      # comma in one of them breaks /plugin install for every user and would
      # otherwise only surface as a bug report.
      - name: Manifests parse and agree
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const plugin = read(".claude-plugin/plugin.json");
            const market = read(".claude-plugin/marketplace.json");
            read(".mcp.json");

            if (!market.plugins.some((entry) => entry.name === plugin.name)) {
              throw new Error("marketplace.json has no entry named " + plugin.name);
            }

            // plugin.json promises this directory, and Claude Code scans
            // skills/ at the plugin root either way, so a missing one installs
            // a plugin with no skills in it and reports no error anywhere.
            if (!fs.existsSync(plugin.skills)) {
              throw new Error("plugin.json points skills at " + plugin.skills + " which does not exist. Skills live in skills/<name>/SKILL.md at the repo root.");
            }

            const app = read("package.json").version;
            if (plugin.version !== app) {
              // Loud, not blocking: set-version.mjs bumps the product files
              // and does not know about plugin.json, so the two drift on every
              // release until somebody teaches it.
              console.log("::warning file=.claude-plugin/plugin.json::plugin.json is " + plugin.version + " but package.json is " + app);
            }
          '

      # Claude Code loads a SKILL.md at the plugin root as a single-skill
      # plugin whenever skills/ is absent. Keeping the root clear means a build
      # that lost skills/ fails the check above instead of quietly installing
      # as one stray skill.
      - name: No SKILL.md at the repo root
        run: |
          if [ -e SKILL.md ]; then
            echo "SKILL.md at the repo root collapses the plugin to a single skill. Put skills in skills/<name>/SKILL.md." >&2
            exit 1
          fi

      # Not every release of the Claude Code CLI carries this subcommand, and a
      # missing validator is not a reason to hold a release. When it is there,
      # warnings count as errors: the community marketplace review runs the
      # same check with the same flag.
      - name: claude plugin validate
        run: |
          set -uo pipefail
          if ! npx -y @anthropic-ai/claude-code plugin --help >/dev/null 2>&1; then
            echo "::notice::claude plugin validate is unavailable here, skipping"
            exit 0
          fi
          npx -y @anthropic-ai/claude-code plugin validate . --strict

  build:
    needs: validate
    runs-on: ubuntu-latest
    # A fork has no business publishing this name, so the run is skipped there
    # rather than failing at the approval gate.
    if: github.repository == 'dotnetdreamer/open-screenshot-generator'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config,
      # where every install script run by `npm ci` below could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No npm cache here or in publish. Other workflow runs can write cache
      # entries, and whatever a poisoned entry held would end up in a
      # published build.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Builds out/, which pack:editor copies into cli/editor/.
      #
      # NEXT_PUBLIC_BASE_PATH must stay UNSET here, exactly as desktop.yml
      # documents for the same reason: a Pages deploy can serve the editor
      # under a sub-path, but the packed editor is served from the root of the
      # local server the CLI runs, so a base path would carry a sub-path into
      # every asset URL in the bundle and 404 the lot.
      #
      # Every NEXT_PUBLIC_* value is inlined into the bundle and so ends up in
      # the public tarball. Pass repository variables that the public website
      # already serves, never a secret. The backend URLs that deploy.yml passes
      # are left out: the packed editor runs on the user's machine against one
      # local project, so Discover, the MCP relay, live editing and cloud save
      # have nothing to talk to. Translation is the exception, because `osg
      # localize` goes through the same service the editor uses, and unset
      # means it silently translates nothing.
      - run: npm run build
        env:
          NEXT_PUBLIC_TRANSLATION_PRIMARY_URL: ${{ vars.NEXT_PUBLIC_TRANSLATION_PRIMARY_URL }}
          NEXT_PUBLIC_TRANSLATION_FALLBACK_URL: ${{ vars.NEXT_PUBLIC_TRANSLATION_FALLBACK_URL }}

      - run: npm ci
        working-directory: cli

      # npm never accepts the same version twice, so publishing code whose
      # version is already on npm, such as a hand run from main between
      # releases, would end in a 403. This step moves the package to one patch
      # past the highest version npm has instead. A release from desktop.yml
      # brings a version npm has not seen, and that goes out unchanged.
      #
      # The bump exists only in this run and is never committed: this job has
      # no write access on purpose, and set-version.mjs still owns the repo's
      # versions. The cost is that a hand run can take the number the next
      # release would have used, and that release then reaches npm one patch
      # ahead of the app. It runs before the CLI build because tools.json and
      # assets.manifest.json both record the version.
      - name: Pick the version to publish
        working-directory: cli
        run: |
          current=$(node -p "require('./package.json').version")
          next=$(node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const res = await fetch("https://registry.npmjs.org/" + pkg.name, {
              headers: { accept: "application/vnd.npm.install-v1+json" },
            });
            // 404 means the package was never published, so every version is free.
            if (!res.ok && res.status !== 404) {
              throw new Error("registry.npmjs.org answered " + res.status + " for " + pkg.name);
            }
            const published = res.ok ? Object.keys((await res.json()).versions) : [];

            const parse = (v) => v.split(".").map(Number);
            const newer = (a, b) => {
              const [x, y] = [parse(a), parse(b)];
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
              return false;
            };
            // A prerelease does not use up a patch number, so only X.Y.Z counts.
            const highest = published
              .filter((v) => /^\d+\.\d+\.\d+$/.test(v))
              .reduce((best, v) => (newer(v, best) ? v : best), "0.0.0");

            if (newer(pkg.version, highest)) {
              console.log(pkg.version);
            } else {
              const [major, minor, patch] = parse(highest);
              console.log(major + "." + minor + "." + (patch + 1));
            }
          ')
          if [ "$next" != "$current" ]; then
            npm version "$next" --no-git-tag-version
            echo "::notice::npm already has ${current} or later, so this run publishes ${next}"
          fi

      - run: npm run build
        working-directory: cli

      # Copies the app shell, the template JSONs and the AI catalog from out/
      # into cli/editor/, and writes assets.manifest.json for the artwork that
      # hydrates at run time. package.json ships both.
      - run: npm run pack:editor
        working-directory: cli

      # `templates` is the only command that needs no browser and no editor
      # session, so it is the one thing a runner with no Chrome can prove.
      # Reading its output checks three things at once: the build produced a
      # runnable dist/cli.js, --json really is a clean machine channel with no
      # human line leaking into stdout, and the template catalog survived
      # pack:editor. Written to RUNNER_TEMP so nothing lands in the package.
      - name: Smoke test the built CLI
        working-directory: cli
        run: |
          node dist/cli.js --version
          node dist/cli.js templates --json > "$RUNNER_TEMP/templates.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const parsed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/templates.json", "utf8"));
            const list = Array.isArray(parsed) ? parsed : parsed.templates;
            if (!Array.isArray(list) || list.length === 0) {
              throw new Error("osg templates --json listed nothing");
            }
            console.log("templates listed: " + list.length);
          '

      # --ignore-scripts because build and pack:editor already ran above as
      # their own steps, and prepublishOnly does not run on a pack anyway.
      # npm pack does not create --pack-destination, hence the mkdir.
      - name: Pack
        working-directory: cli
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - name: Check the tarball for anything that must not be public
        working-directory: cli
        run: node scripts/check-tarball.mjs "$RUNNER_TEMP"/package/*.tgz

      - id: version
        run: echo "version=$(node -p "require('./cli/package.json').version")" >> "$GITHUB_OUTPUT"

      # Anyone signed in to GitHub can download an artifact from a public
      # repository. That is fine for a tarball that passed the check above and
      # is about to be on npm anyway, and one day is all publish needs.
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers and the main / v* ref rule live on this environment
    # (Settings > Environments > npm). The first-publish NPM_TOKEN is a secret
    # of this environment only, so no other job can read it.
    environment: npm
    permissions:
      # Trusted publishing and --provenance both need an OIDC token from
      # GitHub, and this is the only job allowed to mint one.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: package

      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      # registry-url writes the .npmrc that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Publishing a tarball rather than a folder runs no package scripts, so
      # nothing but npm executes in the job that holds publish rights.
      #
      # NODE_AUTH_TOKEN is only for the very first publish (see the top of this
      # file). Once the secret is deleted it is empty and OIDC does the auth.
      #
      # The ./ matters: npm reads a bare `package/x.tgz` as a GitHub owner/repo
      # shorthand and tries to clone it.
      #
      # A 403 here can still mean the version is taken. The build job only
      # skips versions npm had when it ran, so a publish from outside this
      # workflow in the meantime gets there first. Running the workflow again
      # picks the next free patch.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./package/*.tgz --provenance --access public

      - name: Summary
        run: |
          {
            echo "Published open-screenshot-generator@${{ needs.build.outputs.version }} to npm"
            echo
            echo "    npx open-screenshot-generator@${{ needs.build.outputs.version }} doctor"
          } >> "$GITHUB_STEP_SUMMARY"
